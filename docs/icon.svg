<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>bambu-swift</title>
  <rect width="256" height="256" rx="56" fill="#17171b"/>

  <!-- signal: the printer is on your network -->
  <g fill="none" stroke="#ffb547" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M186 58 a16 16 0 0 1 16 16"/>
    <path d="M186 40 a34 34 0 0 1 34 34"/>
  </g>

  <!-- hot end and nozzle -->
  <rect x="94" y="42" width="68" height="40" rx="9" fill="#ecebe6"/>
  <path d="M112 82 H144 L135 104 H121 Z" fill="#ecebe6"/>

  <!-- filament coming out -->
  <rect x="125" y="104" width="6" height="36" rx="3" fill="#ffb547"/>

  <!-- the print, one layer at a time -->
  <rect x="64" y="196" width="128" height="16" rx="8" fill="#ecebe6"/>
  <rect x="74" y="176" width="108" height="16" rx="8" fill="#ecebe6"/>
  <rect x="84" y="156" width="88" height="16" rx="8" fill="#ecebe6"/>
  <rect x="94" y="136" width="40" height="16" rx="8" fill="#ffb547"/>
</svg>
